# UTF-8. Generated by the settings page. API keys are stored with Windows DPAPI.

[connection]
mode = "local"

[model]
engine_path = "runtime/llama-server.exe"
model_path = "models/model.gguf"
context_size = 32768
cache_type_k = "q8_0"
cache_type_v = "q8_0"
gpu_layers = "all"
flash_attention = "on"
batch_size = 512
ubatch_size = 128
startup_timeout_seconds = 180
auto_load = true
reasoning = "on"
reasoning_budget = -1

[generation]
temperature = 1.0
top_k = 64
top_p = 0.95
min_p = 0.05
max_tokens = 8192

[api]
protocol = "openai"
base_url = "https://api.openai.com/v1"
model = ""
endpoint = "chat"
reasoning_effort = "auto"
thinking_mode = "auto"
thinking_budget = 1024
max_tokens = 8192
token_field = "max_tokens"
auth_mode = "protocol"

[prompts]
system_prompt_file = "prompts/system_prompt.md"
user_prompt_file = "prompts/user_prompt.md"

[ui]
edge = "right"
resting_opacity = 0.48
animation_ms = 200
panel_width = 430
panel_height = 650
